[project]
name = "enterprise-ai-soc-layer3"
version = "1.0.0"
description = "CySIEM Layer 3 - Asset Intelligence Fabric (Team 2): entity extraction, asset discovery, user/device/IP mapping, vulnerability & threat indicator extraction"
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
